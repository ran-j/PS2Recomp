name: build

on: [push, pull_request]

jobs:
  linux-gcc-clang:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    name: linux-${{ matrix.compiler }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev pkg-config libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      - name: Tool tests
        run: python3 -B -m unittest discover -s tools/tests

      - name: VU1 program fixtures
        run: python3 -B ps2xTest/data/vu_programs.py "$RUNNER_TEMP/vu-programs"

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc
            export CXX=g++
          else
            export CC=clang
            export CXX=clang++
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-msse4.1 -DCMAKE_CXX_FLAGS=-msse4.1 \
            -DPS2X_VU_PROGRAM_PROFILES="$RUNNER_TEMP/vu-programs"

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        env:
          PS2_VU_PROGRAM_FIXTURES: ${{ runner.temp }}/vu-programs
          PS2_VU_REQUIRE_PROGRAMS: 1
        run: ./build/ps2xTest/ps2x_tests

      - name: Rebuild VU1 programs in 128-pair chunks
        run: |
          cmake -S . -B build -DPS2X_VU_PROGRAM_MAX_PAIRS=128
          cmake --build build --config Release --target ps2x_tests

      - name: Tests with 128-pair chunks
        env:
          PS2_VU_PROGRAM_FIXTURES: ${{ runner.temp }}/vu-programs
          PS2_VU_REQUIRE_PROGRAMS: 1
        run: ./build/ps2xTest/ps2x_tests

  windows-msvc:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_arch: x86_64
    
    name: windows-msvc-${{ matrix.target_arch }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      
      - uses: lukka/get-cmake@latest

      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: |
          cmake -B build
          cmake --build build --config Release

      - name: Tests
        shell: cmd
        run: |
          .\build\ps2xTest\Release\ps2x_tests.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: PS2Recomp - Windows
          path: |
            build/ps2xAnalyzer/Release/*.exe
            build/ps2xRecomp/Release/*.exe
            build/ps2xTest/Release/*.exe
